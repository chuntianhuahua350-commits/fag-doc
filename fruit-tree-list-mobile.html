<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>果树列表</title>
  <style>
    :root {
      --primary: #2fb168;
      --primary-deep: #23824d;
      --primary-light: #eaf9f1;
      --red: #e95f5f;
      --orange: #f0a63b;
      --grey: #8f9a94;
      --dark: #26342c;
      --line: #edf0ee;
      --bg: #f7f8f7;
      --shadow: 0 10px 30px rgba(24, 39, 29, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: linear-gradient(180deg, #eef8ef 0%, #f7f8f7 180px, #f7f8f7 100%);
      color: var(--dark);
    }

    .page {
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 0 14px 24px;
      position: relative;
    }

    .nav {
      height: 92px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 14px;
      font-size: 18px;
      font-weight: 700;
      color: #1c2e23;
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(180deg, rgba(238, 248, 239, 0.96), rgba(238, 248, 239, 0.72), rgba(238, 248, 239, 0));
      backdrop-filter: blur(10px);
    }

    .nav .back {
      position: absolute;
      left: 0;
      bottom: 11px;
      width: 38px;
      height: 38px;
      border-radius: 38px;
      border: 1px solid rgba(47, 177, 104, 0.15);
      background: rgba(255, 255, 255, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-deep);
      font-size: 18px;
    }

    .notice-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      background: var(--primary-light);
      color: var(--primary-deep);
      font-size: 12px;
      line-height: 1.6;
    }

    .notice-icon {
      width: 20px;
      height: 20px;
      border-radius: 20px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex: 0 0 auto;
    }

    .search-box {
      margin-bottom: 14px;
    }

    .search {
      width: 100%;
      height: 46px;
      border: none;
      outline: none;
      border-radius: 46px;
      background: #fff;
      box-shadow: var(--shadow);
      padding: 0 16px;
      color: var(--grey);
      font-size: 14px;
    }

    .summary-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .summary-card {
      flex: 1;
      background: #fff;
      border-radius: 18px;
      padding: 14px 12px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .summary-card strong {
      display: block;
      font-size: 18px;
      color: var(--primary-deep);
      margin-bottom: 4px;
    }

    .summary-card span {
      font-size: 12px;
      color: var(--grey);
    }

    .list-box {
      background: #fff;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .list-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 10px;
      font-size: 12px;
      color: var(--grey);
      border-bottom: 1px solid var(--line);
    }

    .list-item-box {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .list-item-box:last-child {
      border-bottom: none;
    }

    .space-between {
      display: flex;
      justify-content: space-between;
    }

    .align-items {
      display: flex;
      align-items: center;
    }

    .mb12 {
      margin-bottom: 12px;
    }

    .mb16 {
      margin-bottom: 16px;
    }

    .meta-label {
      color: var(--grey);
      font-size: 12px;
    }

    .meta-value {
      color: var(--dark);
      font-size: 13px;
      font-weight: 600;
    }

    .status {
      font-size: 13px;
      font-weight: 600;
    }

    .status.green {
      color: var(--primary);
    }

    .status.orange {
      color: var(--orange);
    }

    .status.red {
      color: var(--red);
    }

    .tree-content {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .icon-img {
      width: 96px;
      height: 84px;
      border-radius: 14px;
      object-fit: cover;
      background: #eef1ef;
      flex: 0 0 auto;
    }

    .icon-content {
      width: calc(100% - 108px);
    }

    .tree-name {
      font-size: 16px;
      font-weight: 700;
      color: #223028;
      margin-bottom: 8px;
    }

    .tree-line {
      font-size: 12px;
      color: var(--grey);
      line-height: 1.7;
      margin-bottom: 4px;
    }

    .tree-line strong {
      color: #44544a;
      font-weight: 600;
    }

    .action-bar {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    .action-row {
      justify-content: flex-end;
    }

    .mini-btn,
    .mini-btn-primary,
    .mini-btn-danger {
      min-width: 76px;
      height: 34px;
      padding: 0 14px;
      border-radius: 34px;
      font-size: 12px;
      border: none;
    }

    .mini-btn {
      color: #5d6b64;
      background: #f5f6f5;
      border: 1px solid #ebefec;
    }

    .mini-btn-primary {
      color: #fff;
      background: var(--primary);
    }

    .mini-btn-danger {
      color: var(--red);
      background: #fff5f5;
      border: 1px solid #ffdede;
    }

    .empty-tip {
      padding: 18px;
      color: var(--grey);
      text-align: center;
      font-size: 12px;
    }

    .add-btn {
      position: fixed;
      right: calc(50% - 205px + 18px);
      bottom: 82px;
      width: 58px;
      height: 58px;
      border-radius: 58px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 14px 24px rgba(47, 177, 104, 0.28);
    }

    .link-note {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: var(--grey);
    }

    .link-note a {
      color: var(--primary-deep);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="nav">
      <div class="back">&#x2039;</div>
      果树列表
    </div>

    <div class="search-box">
      <input class="search" type="text" value="搜索果树名称 / 编号 / 区域" />
    </div>

    <section class="list-box">

      <article class="list-item-box">
        <div class="space-between align-items mb12">
          <div class="align-items">
            <span class="meta-label">编号：</span>
            <span class="meta-value">A-03-12</span>
          </div>
          <div class="status green">挂果中</div>
        </div>
        <div class="tree-content">
          <img class="icon-img" src="https://images.unsplash.com/photo-1464226184884-fa280b87c399?auto=format&fit=crop&w=800&q=80" alt="红富士苹果树" />
          <div class="icon-content">
            <div class="tree-name">红富士苹果树</div>
            <div class="tree-line">所属区域：东二区 12 号垄</div>
            <div class="tree-line"><strong>认植年价：</strong>¥ 299/年 · <span class="status green">已认植</span></div>
          </div>
        </div>
        <div class="space-between align-items action-row">
          <div class="action-bar">
            <button class="mini-btn-primary" type="button">编辑配置</button>
            <button class="mini-btn" type="button">查看详情</button>
            <button class="mini-btn" type="button">二维码</button>
            <button class="mini-btn-danger" type="button">删除</button>
          </div>
        </div>
      </article>

      <article class="list-item-box">
        <div class="space-between align-items mb12">
          <div class="align-items">
            <span class="meta-label">编号：</span>
            <span class="meta-value">B-01-08</span>
          </div>
          <div class="status orange">长花苞</div>
        </div>
        <div class="tree-content">
          <img class="icon-img" src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=800&q=80" alt="翠冠梨树" />
          <div class="icon-content">
            <div class="tree-name">翠冠梨树</div>
            <div class="tree-line">所属区域：南一区 8 号垄</div>
            <div class="tree-line"><strong>认植年价：</strong>¥ 199/年 · <span class="meta-label">未认植</span></div>
          </div>
        </div>
        <div class="space-between align-items action-row">
          <div class="action-bar">
            <button class="mini-btn-primary" type="button">编辑配置</button>
            <button class="mini-btn" type="button">查看详情</button>
            <button class="mini-btn" type="button">二维码</button>
            <button class="mini-btn-danger" type="button">删除</button>
          </div>
        </div>
      </article>

      <article class="list-item-box">
        <div class="space-between align-items mb12">
          <div class="align-items">
            <span class="meta-label">编号：</span>
            <span class="meta-value">C-05-21</span>
          </div>
          <div class="status red">待完善</div>
        </div>
        <div class="tree-content">
          <img class="icon-img" src="https://images.unsplash.com/photo-1471193945509-9ad0617afabf?auto=format&fit=crop&w=800&q=80" alt="阳光玫瑰葡萄树" />
          <div class="icon-content">
            <div class="tree-name">阳光玫瑰葡萄树</div>
            <div class="tree-line">所属区域：北三区 21 号棚</div>
            <div class="tree-line"><strong>认植年价：</strong>¥ 399/年 · <span class="meta-label">未认植</span></div>
          </div>
        </div>
        <div class="space-between align-items action-row">
          <div class="action-bar">
            <button class="mini-btn-primary" type="button">编辑配置</button>
            <button class="mini-btn" type="button">查看详情</button>
            <button class="mini-btn" type="button">二维码</button>
            <button class="mini-btn-danger" type="button">删除</button>
          </div>
        </div>
      </article>

      <article class="list-item-box">
        <div class="space-between align-items mb12">
          <div class="align-items">
            <span class="meta-label">编号：</span>
            <span class="meta-value">D-02-15</span>
          </div>
          <div class="status green">养护中</div>
        </div>
        <div class="tree-content">
          <img class="icon-img" src="https://images.unsplash.com/photo-1597848212624-a19eb35e2651?auto=format&fit=crop&w=800&q=80" alt="蜜桃树" />
          <div class="icon-content">
            <div class="tree-name">蜜桃树</div>
            <div class="tree-line">所属区域：西一区 15 号垄</div>
            <div class="tree-line"><strong>认植年价：</strong>¥ 259/年 · <span class="meta-label">未认植</span></div>
          </div>
        </div>
        <div class="space-between align-items action-row">
          <div class="action-bar">
            <button class="mini-btn-primary" type="button">编辑配置</button>
            <button class="mini-btn" type="button">查看详情</button>
            <button class="mini-btn" type="button">二维码</button>
            <button class="mini-btn-danger" type="button">删除</button>
          </div>
        </div>
      </article>

      <div class="empty-tip">下拉可继续加载更多果树档案</div>
    </section>

    <div class="add-btn">+</div>

    <div class="link-note">
      配置页：<a href="./fruit-tree-config-mobile.html">果树配置</a> ·
      详情页：<a href="./fruit-tree-detail-mobile.html">果树详情</a> ·
      认植审核：<a href="./fruit-tree-adopt-audit-list-mobile.html">果树认植审核</a>
    </div>
  </main>
</body>
</html>
